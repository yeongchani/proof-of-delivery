<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">PoD의 네 단계</title>
  <desc id="desc">대금 예치, 고정된 테스트 실행, 별도 환경에서 결과 검토와 서명, 이의 기간 종료 후 지급 호출.</desc>
  <rect width="760" height="350" rx="18" fill="#f4f6fa"/>
  <g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">
    <g transform="translate(24 24)">
      <rect width="344" height="139" rx="12" fill="#ffffff" stroke="#d6dee9"/>
      <text x="22" y="34" font-size="14" font-weight="700" fill="#3462aa">01 / 고객</text>
      <text x="22" y="72" font-size="25" font-weight="700" fill="#17263c">대금 예치</text>
      <text x="22" y="105" font-size="17" fill="#516078">합격 기준을 정하고 돈을 맡깁니다.</text>
    </g>
    <g transform="translate(392 24)">
      <rect width="344" height="139" rx="12" fill="#ffffff" stroke="#d6dee9"/>
      <text x="22" y="34" font-size="14" font-weight="700" fill="#3462aa">02 / 검증 프로그램</text>
      <text x="22" y="72" font-size="25" font-weight="700" fill="#17263c">테스트 실행</text>
      <text x="22" y="105" font-size="17" fill="#516078">합의한 검사로 납품물을 확인합니다.</text>
    </g>
    <g transform="translate(24 187)">
      <rect width="344" height="139" rx="12" fill="#ffffff" stroke="#d6dee9"/>
      <text x="22" y="34" font-size="14" font-weight="700" fill="#3462aa">03 / 러너 운영자</text>
      <text x="22" y="72" font-size="25" font-weight="700" fill="#17263c">검토 후 서명</text>
      <text x="22" y="105" font-size="17" fill="#516078">별도 환경에서 결과를 승인합니다.</text>
    </g>
    <g transform="translate(392 187)">
      <rect width="344" height="139" rx="12" fill="#e7effc" stroke="#a9bee0"/>
      <text x="22" y="34" font-size="14" font-weight="700" fill="#3462aa">04 / 누구나 실행 가능</text>
      <text x="22" y="72" font-size="25" font-weight="700" fill="#17263c">이의 기간 후 지급</text>
      <text x="22" y="105" font-size="17" fill="#516078">지급을 호출하면 계약대로 송금됩니다.</text>
    </g>
  </g>
</svg>
