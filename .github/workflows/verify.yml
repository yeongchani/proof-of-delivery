name: pod-verify

on:
  push:
    paths: ["example-deliverable/**", "runner/**", "package-lock.json", ".github/workflows/verify.yml"]
  workflow_dispatch:
    inputs:
      agreement_id:
        description: Agreement ID to include in unsigned evidence
        type: string
        default: "1"
      milestone_index:
        description: Milestone index to include in unsigned evidence
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGREEMENT_ID: ${{ inputs.agreement_id || '1' }}
      MILESTONE_INDEX: ${{ inputs.milestone_index || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run acceptance tests
        run: npm run runner:test # -> runner/out/result.json
      - name: Settlement requires separate review
        run: echo "Unsigned evidence only. Review this run and sign from a separate trusted checkout; see docs/verification.md."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-result
          path: runner/out/
          if-no-files-found: error
          retention-days: 30
